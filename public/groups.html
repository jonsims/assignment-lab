<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groups · {{TITLE}}</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="assets/lab.css">
<script src="assets/kinds.js"></script>
<style>
  :root { --disp: "Bricolage Grotesque", Arial, Helvetica, sans-serif; --bg: #F1F5F2; }
  /* Text scales with the narrower of width and height, so every view fits with or without the browser bars showing. */
  body { font-size: clamp(11px, min(1.12vw, 1.95vh), 22px); background: var(--bg); }
  /* The Join view has fewer rows, so it uses bigger text. */
  body.view-join { font-size: clamp(12px, min(1.4vw, 2.45vh), 27px); }
  .kicon { width: 1.25em; height: 1.25em; display: block; }
  .kdot { width: 2em; height: 2em; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; flex: none; }

  .top { display: flex; align-items: center; gap: 1.2em; padding: 0.6em 1.6em; background: var(--green); color: #fff; }
  .top h1 { margin: 0; font: 800 1.85em/1 var(--disp); color: #fff; letter-spacing: -0.01em; }
  .top h1 span { color: var(--gold); }
  .tabs { display: flex; gap: 0.3em; margin-left: 0.6em; }
  .tabs button { font: 700 1em var(--disp); color: #fff; background: transparent; border: 0; border-radius: 99px; padding: 0.35em 0.95em; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: #fff; color: var(--green); }
  .tabs button:focus-visible { outline: 3px solid var(--gold); }
  .count { margin-left: auto; display: flex; align-items: baseline; gap: 0.35em; background: rgba(255,255,255,0.12); border-radius: 99px; padding: 0.25em 0.9em; font-weight: bold; }
  .count b { font: 800 1.6em/1 var(--disp); color: var(--gold); display: inline-block; }
  .count b.bump { animation: bump 0.5s ease-out; }
  @keyframes bump { 40% { transform: scale(1.45); } }
  .view { padding: 1em 1.6em 0.8em; }

  /* Join */
  .join { display: grid; grid-template-columns: minmax(16em, 21em) 1fr; gap: 2.2em; align-items: start; }
  .qrbox { background: #fff; border-radius: 1.2em; padding: 1.1em 1.2em 1.2em; text-align: center; border: 3px solid var(--gold); }
  .qrbox img { width: 100%; height: auto; display: block; }
  .qrbox .addr { font: 700 1.3em/1.2 var(--disp); color: var(--green); margin: 0.4em 0 0; word-break: break-all; }
  .joined { margin-top: 1em; text-align: left; }
  .joined h2 { margin: 0 0 0.4em; font: 700 1em var(--disp); color: var(--green); }
  .joined .chips { min-height: 2em; }
  .bars h2 { margin: 0 0 0.7em; font: 800 1.45em/1.15 var(--disp); color: var(--green); }
  .bar-row { display: grid; grid-template-columns: 2em 13.5em 1fr 6.5em; gap: 0.7em; align-items: center; margin-bottom: 0.5em; }
  .bar-row .kdot { width: 1.8em; height: 1.8em; }
  .bar-row .nm { font-weight: bold; line-height: 1.2; }
  .bar { display: flex; height: 1.7em; background: #E3EAE6; border-radius: 99px; overflow: hidden; }
  .bar span { display: flex; align-items: center; justify-content: center; font-size: 0.85em; font-weight: bold; min-width: 0; overflow: hidden; transition: width 0.6s cubic-bezier(.2,.8,.2,1); }
  .s0 { background: #B9C6C0; color: var(--ink); }
  .s1 { background: var(--gold); color: var(--ink); }
  .s2 { background: var(--green); color: #fff; }
  .bar-row .helpers { font-size: 0.9em; color: var(--green); font-weight: bold; }
  .legend { display: flex; gap: 1.4em; margin: 0.9em 0 0 2.7em; font-size: 0.95em; }
  .legend i { display: inline-block; width: 1em; height: 1em; border-radius: 50%; vertical-align: -0.12em; margin-right: 0.35em; }

  /* People, as a name with a round badge of initials */
  .chips { display: flex; flex-wrap: wrap; gap: 0.3em; }
  .chip { display: inline-flex; align-items: center; gap: 0.35em; padding: 0.1em 0.65em 0.1em 0.15em; border-radius: 99px; font-size: 0.85em; background: #fff; border: 1px solid var(--line); }
  .chip i { font-style: normal; width: 1.6em; height: 1.6em; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75em; font-weight: bold; background: var(--pale); color: var(--green); }
  .chip.help { background: var(--green); color: #fff; border-color: var(--green); font-weight: bold; }
  .chip.help i { background: var(--gold); color: var(--ink); }
  .chip.want { background: #FCF9E3; border-color: var(--gold-dark); }
  .chip.pop { animation: pop 0.45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: scale(0.3); opacity: 0; } }
  .none { font-size: 0.85em; color: var(--muted); margin: 0.2em 0; }

  /* Who can help */
  #v-help { padding-top: 0.8em; }
  .help-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.6em; }
  .help-grid .chip { font-size: 0.78em; }
  .help-grid .chip.want { padding-left: 0.6em; }
  .hcard { background: #fff; border-radius: 0.9em; padding: 0.6em 0.8em 0.7em; border-left: 0.35em solid var(--k); }
  .hcard h3 { margin: 0 0 0.2em; font: 700 0.98em/1.12 var(--disp); color: var(--k); display: flex; align-items: center; gap: 0.45em; }
  .hcard h3 .kdot { width: 1.7em; height: 1.7em; background: var(--k); }
  .hcard .lab { font-size: 0.78em; font-weight: bold; color: var(--muted); margin: 0.45em 0 0.25em; }

  /* Groups */
  #v-groups { padding-top: 0.8em; }
  .group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(14.5em, 1fr)); gap: 0.75em; }
  .gcard { background: #fff; border-radius: 0.9em; overflow: hidden; box-shadow: 0 2px 0 rgba(0,0,0,0.06); }
  .gcard .gh { display: flex; align-items: center; gap: 0.55em; padding: 0.4em 0.75em; background: var(--k); color: #fff; }
  .gcard .gn { font: 800 2em/1 var(--disp); min-width: 1.1em; }
  .gcard .gt { font: 700 0.95em/1.12 var(--disp); flex: 1; }
  .gcard .gh .kicon { width: 1.5em; height: 1.5em; opacity: 0.9; }
  .gcard .tb { flex: none; background: #fff; color: var(--k); border-radius: 99px; padding: 0.1em 0.55em; font: 800 0.85em/1.3 var(--disp); }
  /* Tables: the room map */
  #v-tables { padding-top: 0.6em; }
  .room { position: relative; margin: 0 auto; width: min(100%, 170vh); aspect-ratio: 16 / 8.2; }
  .room .front { position: absolute; left: 12%; right: 12%; top: 0; border-top: 0.25em solid var(--ink); text-align: center; font: 700 1em var(--disp); padding-top: 0.15em; color: var(--muted); }
  .tbl { position: absolute; width: 27%; height: 21.5%; box-sizing: border-box; background: #fff; border: 0.15em solid var(--line); border-radius: 0.7em; overflow: hidden; }
  .tbl.used { border-color: var(--k); }
  .tbl .th { display: flex; align-items: center; gap: 0.45em; padding: 0.3em 0.6em; background: var(--k, #fff); color: #fff; }
  .tbl .tn { font: 800 1.45em/1 var(--disp); }
  .tbl .tk { flex: 1; font: 700 0.95em/1.12 var(--disp); }
  .tbl .th .kicon { width: 1.3em; height: 1.3em; flex: none; opacity: 0.9; }
  .tbl .tgn { flex: none; font-size: 0.72em; font-weight: bold; opacity: 0.9; white-space: nowrap; }
  .tbl.empty .th { background: transparent; color: #B9C6C0; }
  .tbl .names { padding: 0.3em 0.6em 0.3em; }
  .tbl .tg span { padding: 0.05em 0.5em; border-radius: 99px; color: #fff; background: var(--k); font: 700 0.72em/1.4 var(--f); white-space: nowrap; margin-right: 0.2em; }
  .tbl .names { font-size: 1.08em; line-height: 1.28; }
  .tbl .names.two { columns: 2; column-gap: 0.6em; font-size: 0.95em; }
  .tbl .names div { break-inside: avoid; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tbl .names b { color: var(--k); font-size: 0.85em; }
  .gcard ul { list-style: none; margin: 0; padding: 0.3em 0.75em 0.45em; }
  .gcard li { display: flex; align-items: center; gap: 0.5em; padding: 0.22em 0; }
  .gcard li > i { font-style: normal; width: 1.75em; height: 1.75em; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.78em; font-weight: bold; background: var(--kt); color: var(--k); }
  .gcard li.helper > i { background: var(--gold); color: var(--ink); }
  .gcard li b { font: 700 1em/1.2 var(--disp); overflow-wrap: anywhere; }
  .chip { overflow-wrap: anywhere; }
  .chip i { overflow-wrap: normal; white-space: nowrap; }
  .gcard li small { display: none; color: var(--muted); font-size: 0.8em; }
  body.details .gcard li small { display: block; }
  .tag { display: inline-block; margin-left: 0.35em; padding: 0 0.5em; border-radius: 99px; background: var(--gold); font: bold 0.68em/1.6 var(--f); vertical-align: 0.15em; }
  .deal .gcard { animation: deal 0.55s cubic-bezier(.2,1.3,.4,1) both; animation-delay: calc(var(--i) * 70ms); }
  @keyframes deal { from { opacity: 0; transform: translateY(-1.6em) rotate(-4deg) scale(0.85); } }
  .empty { max-width: 34em; font: 700 1.4em/1.3 var(--disp); color: var(--green); margin-top: 1.5em; }
  .late { margin-top: 1em; padding: 0.7em 1em; background: #FCF9E3; border-left: 0.3em solid var(--gold-dark); border-radius: 0.5em; }

  @media (prefers-reduced-motion: reduce) {
    .deal .gcard, .chip.pop, .count b.bump { animation: none; }
    .bar span { transition: none; }
  }

  /* Host controls sit in a bar that wakes near the bottom of the screen, so the projector stays clean. */
  .host { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; gap: 0.5em; align-items: center; padding: 0.5em 1em;
    background: rgba(26,31,28,0.94); color: #fff; font-size: 15px; opacity: 0; transition: opacity 0.2s; }
  .host:hover, .host:focus-within, .host.show { opacity: 1; }
  .host .btn { min-height: 36px; padding: 6px 12px; font-size: 14px; flex: none; }
  .host .btn.danger { background: #fff; color: var(--bad); border: 2px solid var(--bad); }
  .host select { font: 15px var(--f); padding: 7px; border-radius: 8px; }
  .host .note { margin-left: auto; color: #DDE6E1; }
</style>
</head>
<body>
<header class="top">
  <h1>Find your <span>group</span></h1>
  <nav class="tabs" aria-label="Views">
    <button type="button" data-view="join" aria-pressed="true">1 Join</button>
    <button type="button" data-view="help" aria-pressed="false">2 Who can help</button>
    <button type="button" data-view="groups" aria-pressed="false">3 Groups</button>
    <button type="button" data-view="tables" aria-pressed="false">4 Tables</button>
  </nav>
  <div class="count"><b id="n">0</b> answers</div>
</header>

<section class="view" id="v-join">
  <div class="join">
    <div>
      <div class="qrbox">
        <img id="qr" alt="QR code for the Find your group form">
        <p class="addr" id="addr"></p>
      </div>
      <div class="joined" id="joined-box" hidden>
        <h2>Just joined</h2>
        <div class="chips" id="joined"></div>
      </div>
    </div>
    <div class="bars">
      <h2>How the room uses AI on each kind of assignment</h2>
      <div id="bars"></div>
      <div class="legend">
        <span><i class="s0"></i>Not at all</span>
        <span><i class="s1"></i>I would like to use AI</span>
        <span><i class="s2"></i>I am using AI now</span>
      </div>
    </div>
  </div>
</section>

<section class="view" id="v-help" hidden>
  <div class="help-grid" id="help"></div>
</section>

<section class="view" id="v-groups" hidden>
  <div id="groups"></div>
</section>

<section class="view" id="v-tables" hidden>
  <div class="room" id="room"></div>
</section>

<div class="host" id="host">
  <label for="per">Group size</label>
  <select id="per"><option value="3">3, or 4 when needed</option><option value="4">4, or 3 when needed</option></select>
  <a class="btn light" href="./">Home</a>
  <button type="button" class="btn gold" id="make">Make groups</button>
  <button type="button" class="btn light" id="add">Add new answers to groups</button>
  <button type="button" class="btn light" id="clear-groups">Clear the groups</button>
  <button type="button" class="btn light" id="details">Show details in groups</button>
  <button type="button" class="btn danger" id="reset">Delete all answers</button>
  <span class="note" id="note">Keys 1 to 4 switch views. D shows details.</span>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const LEVELS = ["Not at all", "Would like to use AI", "Using AI now"];
let ASSIGN = [], ABY = {}, answers = [], saved = null, view = "join";

/* ------------------------------------------------------------ views */

function setView(v) {
  view = v;
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
  ["join", "help", "groups", "tables"].forEach((k) => { $("v-" + k).hidden = k !== v; document.body.classList.toggle("view-" + k, k === v); });
  lastKey = "";
  render();
}
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
document.addEventListener("keydown", (e) => {
  if (e.target.closest("select, input")) return;
  if (e.key === "1") setView("join");
  if (e.key === "2") setView("help");
  if (e.key === "3") setView("groups");
  if (e.key === "4") setView("tables");
  if (e.key === "d" || e.key === "D") toggleDetails();
});
function toggleDetails() {
  const on = document.body.classList.toggle("details");
  if ($("details")) $("details").textContent = on ? "Hide details in groups" : "Show details in groups";
}
$("details").addEventListener("click", toggleDetails);
// The host bar shows when the pointer moves near the bottom of the screen.
document.addEventListener("mousemove", (e) => {
  const bar = $("host");
  if (bar) bar.classList.toggle("show", e.clientY > window.innerHeight - 90);
});

const kstyle = (id) => "--k:" + kindColor(id) + ";--kt:" + kindColor(id) + "22";
const chip = (p, cls, pop) => '<span class="chip ' + cls + (pop ? " pop" : "") + '">' + (cls === "want" ? "" : "<i>" + esc(initials(p.name)) + "</i>") + esc(p.name) + "</span>";

// Names that arrived since the page opened pop in. Names already there at load stay still.
let seen = null;
function renderJoined() {
  const fresh = new Set();
  if (seen) answers.forEach((p) => { if (!seen.has(p.id)) fresh.add(p.id); });
  seen = new Set(answers.map((p) => p.id));
  const recent = answers.slice().sort((a, b) => b.at - a.at).slice(0, 8);
  $("joined-box").hidden = !recent.length;
  $("joined").innerHTML = recent.map((p) => chip(p, "", fresh.has(p.id))).join("");
}

function renderBars() {
  renderJoined();
  const max = Math.max(1, ...ASSIGN.map((a) => answers.filter((p) => p.rows[a.id]).length));
  $("bars").innerHTML = ASSIGN.map((a) => {
    const c = [0, 0, 0];
    let help = 0;
    answers.forEach((p) => { const r = p.rows[a.id]; if (r) { c[r.lvl]++; if (r.help) help++; } });
    const seg = (i) => '<span class="s' + i + '" style="width:' + (100 * c[i] / max) + '%">' + (c[i] || "") + "</span>";
    return '<div class="bar-row"><span class="kdot" style="background:' + kindColor(a.id) + '">' + kindIcon(a.id) + '</span><div class="nm">' + esc(a.name) +
      '</div><div class="bar">' + seg(0) + seg(1) + seg(2) + '</div><div class="helpers">' + (help ? help + " can help" : "") + "</div></div>";
  }).join("");
}

function renderHelp() {
  $("help").innerHTML = ASSIGN.map((a) => {
    const helpers = [], wants = [];
    answers.forEach((p) => {
      const r = p.rows[a.id];
      if (!r) return;
      if (r.help) helpers.push(p);
      if (r.lvl === 1) wants.push(p);
    });
    const chips = (list, cls) => list.length
      ? '<div class="chips">' + list.map((p) => chip(p, cls)).join("") + "</div>"
      : '<p class="none">Nobody yet</p>';
    return '<div class="hcard" style="' + kstyle(a.id) + '"><h3><span class="kdot">' + kindIcon(a.id) + "</span>" + esc(a.name) + "</h3>" +
      '<div class="lab">Willing to help</div>' + chips(helpers, "help") +
      '<div class="lab">Would like to use AI</div>' + chips(wants, "want") + "</div>";
  }).join("");
}

function memberLine(p, topic) {
  const r = p.rows[topic];
  // The projector names a person's AI use only where they would like to use AI or use it now.
  const bits = [p.div, r ? (r.lvl ? LEVELS[r.lvl] : "") : "Doesn't give this one"];
  if (p.star === topic) bits.push("top pick");
  const helper = r && r.help;
  return '<li class="' + (helper ? "helper" : "") + '"><i>' + esc(initials(p.name)) + "</i><div><b>" + esc(p.name) + "</b>" +
    (helper ? '<span class="tag">Can help</span>' : "") + "<small>" + esc(bits.filter(Boolean).join(", ")) + "</small></div></li>";
}

// The cards deal onto the screen once for each new set of groups, not on every refresh.
let dealtAt = null;
function renderGroups() {
  const by = Object.fromEntries(answers.map((p) => [p.id, p]));
  if (!saved || !saved.list.length) {
    $("groups").innerHTML = '<p class="empty">' + (answers.length
      ? (CAN_HOST ? "Nobody has a group yet. Press Make groups in the bar at the bottom of the screen." : "Nobody has a group yet.")
      : "Nobody has answered yet. Show the Join view so people can scan the QR code.") + "</p>";
    return;
  }
  const placed = new Set();
  const cards = saved.list.map((g, i) => {
    const ms = g.members.map((id) => by[id]).filter(Boolean);
    ms.forEach((p) => placed.add(p.id));
    ms.sort((x, y) => (+!!(y.rows[g.topic] && y.rows[g.topic].help)) - (+!!(x.rows[g.topic] && x.rows[g.topic].help)) || x.name.localeCompare(y.name));
    return '<div class="gcard" style="' + kstyle(g.topic) + ";--i:" + i + '"><div class="gh"><span class="gn">' + g.n + '</span><span class="gt">' +
      esc(ABY[g.topic] ? ABY[g.topic].name : "Any assignment") + "</span>" + (g.table ? '<span class="tb">Table ' + g.table + "</span>" : kindIcon(g.topic)) + "</div><ul>" + ms.map((p) => memberLine(p, g.topic)).join("") + "</ul></div>";
  });
  const late = answers.filter((p) => !placed.has(p.id));
  const deal = dealtAt !== saved.at;
  dealtAt = saved.at;
  $("groups").innerHTML = '<div class="group-grid' + (deal ? " deal" : "") + '">' + cards.join("") + "</div>" +
    (late.length ? '<div class="late"><b>Not in a group yet:</b> ' + late.map((p) => esc(p.name)).join(", ") +
      ". Press Add new answers to groups.</div>" : "");
}

// Each refresh redraws only when an answer or the groups changed, so nothing on the screen flickers.
let lastKey = "", lastCount = 0;
function render() {
  const key = view + "|" + answers.map((p) => p.id + p.at).join() + "|" + (saved ? saved.at : "");
  if (key === lastKey) return;
  lastKey = key;
  $("n").textContent = answers.length;
  if (answers.length > lastCount && lastCount) { $("n").classList.remove("bump"); void $("n").offsetWidth; $("n").classList.add("bump"); }
  lastCount = answers.length;
  if (view === "join") renderBars();
  if (view === "help") renderHelp();
  if (view === "groups") renderGroups();
  if (view === "tables") renderTables();
}

// The room map draws the tables from settings.json: rows of tablesPerRow, numbered from the front left.
// With staggerRows, every second row sits a little to the right. Each table lists its groups and names.
function renderTables() {
  const at = {}, by = Object.fromEntries(answers.map((p) => [p.id, p]));
  (saved ? saved.list : []).forEach((g) => { if (g.table) (at[g.table] = at[g.table] || []).push(g); });
  const per = ROOM.perRow, rows = Math.ceil(TABLES / per);
  const off = ROOM.stagger && per > 1 ? 7 : 0, step = (98 - off) / per, rowStep = 95 / rows;
  const room = $("room");
  room.style.aspectRatio = "16 / " + (2.05 * rows);
  room.style.width = "min(100%, " + Math.round(16 / (2.05 * rows) * 88) + "vh)";
  room.style.fontSize = Math.min(1, 4 / rows) + "em";
  let h = '<div class="front">Front of the room</div>';
  for (let t = 1; t <= TABLES; t++) {
    const row = Math.floor((t - 1) / per), col = (t - 1) % per;
    const left = 1 + col * step + (row % 2 ? off : 0), top = 5 + row * rowStep;
    const gs = at[t] || [];
    const names = gs.flatMap((g) => g.members.map((id) => by[id]).filter(Boolean).map((p) =>
      '<div style="--k:' + kindColor(g.topic) + '">' + (gs.length > 1 ? "<b>" + g.n + "</b> " : "") + esc(p.name) + "</div>"));
    // The header names the table's kind of assignment, the way the group cards do.
    const kinds = [...new Set(gs.map((g) => g.topic))];
    const label = kinds.map((k) => esc(ABY[k] ? ABY[k].name : "Any assignment")).join(" and ");
    const nums = gs.map((g) => g.n);
    h += '<div class="tbl' + (gs.length ? " used" : " empty") + '" style="left:' + left + "%;top:" + top + "%;width:" + (step - 4.5) + "%;height:" + (rowStep - 2.5) + "%" + (gs.length ? ";--k:" + kindColor(kinds[0]) : "") + '"><div class="th"><span class="tn">' + t + "</span>" +
      (gs.length ? '<span class="tk">' + label + '</span><span class="tgn">' + (nums.length > 1 ? "Groups " : "Group ") + nums.join(", ") + "</span>" + kindIcon(kinds[0]) : "") +
      '</div><div class="names' + (names.length > 4 ? " two" : "") + '">' + names.join("") + "</div></div>";
  }
  room.innerHTML = h;
}

async function load() {
  try {
    const out = await fetch("api/match", { cache: "no-store" }).then((r) => r.json());
    answers = out.answers;
    saved = out.groups;
    render();
  } catch (e) { /* the next poll tries again */ }
}

/* ----------------------------------------------------------- sorter */
// Adapted from the CELT 11/11 table sorter (~/AI-Builds/celtmentor/celt11-11-26). Each group gets one
// kind of assignment. A person costs 0 in a group about their top pick, 1 where they use AI or would
// like to, 3 where they give it without AI, and 9 where they don't give it. A group with nobody who
// offered to help costs 6 more, each extra helper costs 2 (helpers spread out), a group where nobody
// wants to change anything costs 2, and each repeat division costs 1.

function pcost(p, t) {
  if (p.star === t) return 0;
  const r = p.rows[t];
  if (!r) return 9;
  return r.lvl === 0 ? 3 : 1;
}

function gcost(ms, t) {
  let c = 0, helpers = 0, learners = 0;
  const dv = {};
  for (const p of ms) {
    c += pcost(p, t);
    const r = p.rows[t];
    if (r && r.help) helpers++;
    if (r && r.lvl < 2 || p.star === t) learners++;
    if (p.div && !/^(staff|other)/i.test(p.div)) dv[p.div] = (dv[p.div] || 0) + 1;
  }
  if (ms.length) {
    if (!helpers) c += 6; else c += (helpers - 1) * 2;
    if (!learners) c += 2;
  }
  for (const k in dv) if (dv[k] > 1) c += dv[k] - 1;
  return c;
}

// Each group takes the kind of assignment that fits its members best.
function relabel(g) {
  let best = g.topic, bc = gcost(g.members, g.topic);
  for (const a of ASSIGN) { const c = gcost(g.members, a.id); if (c < bc) { bc = c; best = a.id; } }
  g.topic = best;
}

function total(gs) { return gs.reduce((s, g) => s + gcost(g.members, g.topic), 0); }

function climb(gs) {
  let improved = true, guard = 0;
  while (improved && guard < 100) {
    improved = false; guard++;
    for (let a = 0; a < gs.length; a++) {
      for (let b = a + 1; b < gs.length; b++) {
        const A = gs[a], B = gs[b];
        for (let ia = 0; ia < A.members.length; ia++) {
          for (let ib = 0; ib < B.members.length; ib++) {
            const before = gcost(A.members, A.topic) + gcost(B.members, B.topic);
            const xa = A.members[ia], xb = B.members[ib];
            A.members[ia] = xb; B.members[ib] = xa;
            if (gcost(A.members, A.topic) + gcost(B.members, B.topic) < before) improved = true;
            else { A.members[ia] = xa; B.members[ib] = xb; }
          }
        }
      }
    }
    for (const g of gs) { const t = g.topic; relabel(g); if (g.topic !== t) improved = true; }
  }
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function makeGroups(people, per) {
  const N = people.length;
  if (!N) return [];
  // Sizes stay at 3 or 4: "3" makes floor(N/3) groups, "4" makes ceil(N/4) groups. A room too small
  // for that (2 or 5 people) gets one smaller group.
  let G = Math.max(1, per === 3 ? Math.floor(N / 3) : Math.ceil(N / 4));
  if (Math.ceil(N / G) > 4) G = Math.ceil(N / 3);
  // Groups go to kinds of assignment in proportion to interest: top pick 3, would like 2, any other use 1.
  const pts = Object.fromEntries(ASSIGN.map((a) => [a.id, 0]));
  for (const p of people) for (const [t, r] of Object.entries(p.rows)) pts[t] += p.star === t ? 3 : r.lvl === 1 ? 2 : 1;
  const alloc = Object.fromEntries(ASSIGN.map((a) => [a.id, 0]));
  const topics = [];
  for (let i = 0; i < G; i++) {
    let best = ASSIGN[0].id, bv = -1;
    for (const a of ASSIGN) { const v = pts[a.id] / (alloc[a.id] + 1); if (v > bv) { bv = v; best = a.id; } }
    alloc[best]++;
    topics.push(best);
  }
  const base = Math.floor(N / G), extra = N % G;
  const gs = topics.map((t, k) => ({ topic: t, size: base + (k < extra ? 1 : 0), members: [] }));
  const seated = new Set();
  // 1. One colleague who offered to help in each group, if anyone did.
  for (const g of gs) {
    const c = people.filter((p) => !seated.has(p.id) && p.rows[g.topic] && p.rows[g.topic].help)
      .sort((x, y) => pcost(x, g.topic) - pcost(y, g.topic));
    if (c.length) { g.members.push(c[0]); seated.add(c[0].id); }
  }
  // 2. Everyone else where they cost least.
  for (const p of people) {
    if (seated.has(p.id)) continue;
    const open = gs.filter((g) => g.members.length < g.size);
    open.sort((a, b) => (gcost(a.members.concat(p), a.topic) - gcost(a.members, a.topic)) - (gcost(b.members.concat(p), b.topic) - gcost(b.members, b.topic)));
    open[0].members.push(p);
    seated.add(p.id);
  }
  // 3. Swap pairs while any swap helps, then try 40 more seeded starts and keep the best.
  climb(gs);
  let bestCost = total(gs), best = gs.map((g) => ({ topic: g.topic, members: g.members.slice() }));
  const rnd = mulberry32(30102026);
  for (let r = 0; r < 40; r++) {
    const order = people.slice();
    for (let q = order.length - 1; q > 0; q--) { const w = Math.floor(rnd() * (q + 1)); [order[q], order[w]] = [order[w], order[q]]; }
    let pos = 0;
    gs.forEach((g) => { g.members = order.slice(pos, pos + g.size); pos += g.size; relabel(g); });
    climb(gs);
    const c = total(gs);
    if (c < bestCost) { bestCost = c; best = gs.map((g) => ({ topic: g.topic, members: g.members.slice() })); }
  }
  return best;
}

// The room's tables and seats come from settings.json. Each group gets its own table until every table
// is taken. After that, a group shares a table, first with a group on the same kind of assignment, then
// wherever the fewest people sit, and never past the seats at a table.
let TABLES = 12, SEATS = 8, ROOM = { perRow: 3, stagger: false }, CAN_HOST = false;
function pickTable(used, kindAt, n, topic) {
  let best = 0, bestScore = Infinity;
  for (let t = 1; t <= TABLES; t++) {
    if (!used[t]) return t;
    if (used[t] + n > SEATS) continue;
    const score = (kindAt[t] === topic ? 0 : 100) + used[t];
    if (score < bestScore) { best = t; bestScore = score; }
  }
  if (best) return best;
  for (let t = 1; t <= TABLES; t++) if (!best || used[t] < used[best]) best = t;
  return best;
}
function seatTables(gs) {
  // Groups on the same kind of assignment get neighbouring table numbers. While there are more groups
  // than tables, two groups share a table: two on the same kind first, then any two, smallest pair
  // first, and never past the seats at a table. In a room too small for everyone, each group left over
  // goes to the table with the fewest people.
  const units = gs.map((g, i) => [i]).sort((a, b) => gs[a[0]].topic.localeCompare(gs[b[0]].topic) || a[0] - b[0]);
  const size = (u) => u.reduce((n, i) => n + gs[i].members.length, 0);
  while (units.length > TABLES) {
    let bi = -1, bj = -1, best = Infinity;
    for (let i = 0; i < units.length; i++) {
      for (let j = i + 1; j < units.length; j++) {
        const n = size(units[i]) + size(units[j]);
        if (n > SEATS) continue;
        const score = (gs[units[i][0]].topic === gs[units[j][0]].topic ? 0 : 1000) + n * 10 + (j - i);
        if (score < best) { best = score; bi = i; bj = j; }
      }
    }
    if (bi < 0) break;
    units[bi] = units[bi].concat(units[bj]);
    units.splice(bj, 1);
  }
  const table = [], seated = Array(TABLES + 1).fill(0);
  units.forEach((u, k) => {
    let t = k + 1;
    if (k >= TABLES) { t = 1; for (let x = 2; x <= TABLES; x++) if (seated[x] < seated[t]) t = x; }
    seated[t] += size(u);
    u.forEach((i) => { table[i] = t; });
  });
  return table;
}

/* ------------------------------------------------------------- host */

// The host's buttons work only on the computer that runs the lab. The x-lab-host header tells the
// server the press came from this page.
async function hostPost(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json", "x-lab-host": "1" }, body: JSON.stringify(body || {}) });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) { alert(out.error || "That did not work. Try again."); return null; }
  return out;
}

function note(t) { $("note").textContent = t; }

$("make").addEventListener("click", async () => {
  if (!answers.length) { note("Nobody has answered yet."); return; }
  if (saved && saved.list.length && !confirm("Make new groups? Everyone's phone shows the new groups, and the old groups are gone.")) return;
  if (answers.length > TABLES * SEATS) note("The room has " + TABLES * SEATS + " seats for " + answers.length + " people, so some tables get more people than seats.");
  else note("Sorting " + answers.length + " people...");
  await new Promise((r) => setTimeout(r, 30));
  const gs = makeGroups(answers.slice(), Number($("per").value));
  const tables = seatTables(gs);
  const out = await hostPost("api/match/groups", { list: gs.map((g, i) => ({ topic: g.topic, table: tables[i], members: g.members.map((p) => p.id) })) });
  if (!out) return;
  saved = out.groups;
  // Groups can't always pack into the seats, for example 15 groups of 3 at 6 tables of 8.
  const atTable = {};
  gs.forEach((g, i) => { atTable[tables[i]] = (atTable[tables[i]] || 0) + g.members.length; });
  const full = Object.values(atTable).filter((n) => n > SEATS).length;
  note("Made " + gs.length + " groups. Phones show them within 5 seconds." + (full ? " " + full + (full === 1 ? " table has" : " tables have") +
    " more people than seats. Groups of 3 or more tables in settings.json would fix that." : ""));
  setView("groups");
});

$("add").addEventListener("click", async () => {
  if (!saved || !saved.list.length) { note("Make the groups first."); return; }
  const placed = new Set(saved.list.flatMap((g) => g.members));
  const late = answers.filter((p) => !placed.has(p.id));
  if (!late.length) { note("Everyone who answered is in a group."); return; }
  const by = Object.fromEntries(answers.map((p) => [p.id, p]));
  const gs = saved.list.map((g) => ({ topic: g.topic, table: g.table || 0, members: g.members.map((id) => by[id]).filter(Boolean) }));
  const cap = 4;
  // Each late person joins the group with room where they fit best. When every group has 4, a group
  // of 5 beats a group of 1, so they join one of those. Only when every group has 5 do they start a new one.
  const added = (g, p) => gcost(g.members.concat(p), g.topic) - gcost(g.members, g.topic);
  for (const p of late) {
    let open = gs.filter((g) => g.members.length < cap);
    if (!open.length) open = gs.filter((g) => g.members.length < cap + 1);
    open.sort((a, b) => added(a, p) - added(b, p));
    if (open.length) { open[0].members.push(p); continue; }
    let bt = ASSIGN[0].id;
    for (const a of ASSIGN) if (pcost(p, a.id) < pcost(p, bt)) bt = a.id;
    // A new group takes an empty table if there is one, the same way Make groups seats people.
    const seated = {}, kindAt = {};
    gs.forEach((g) => { if (g.table) { seated[g.table] = (seated[g.table] || 0) + g.members.length; kindAt[g.table] = kindAt[g.table] || g.topic; } });
    gs.push({ topic: bt, table: pickTable(seated, kindAt, 3, bt), members: [p] });
  }
  const out = await hostPost("api/match/groups", { list: gs.map((g) => ({ topic: g.topic, table: g.table, members: g.members.map((p) => p.id) })) });
  if (!out) return;
  saved = out.groups;
  dealtAt = saved.at;
  note("Added " + late.length + (late.length === 1 ? " person." : " people.") + " Nobody else moved.");
  render();
});

$("clear-groups").addEventListener("click", async () => {
  if (!confirm("Clear the groups? The answers stay, and phones stop showing a group.")) return;
  const out = await hostPost("api/match/groups", { list: null });
  if (out) { saved = null; note("The groups are cleared."); render(); }
});

$("reset").addEventListener("click", async () => {
  if (!confirm("Delete every answer and every group? You can't undo this.")) return;
  const out = await hostPost("api/match/reset");
  if (out) { answers = []; saved = null; note("Deleted " + out.cleared + " answers."); render(); }
});

(async () => {
  const cfg = await fetch("api/config").then((r) => r.json());
  ASSIGN = cfg.assign;
  labKinds(ASSIGN);
  ABY = Object.fromEntries(ASSIGN.map((a) => [a.id, a]));
  TABLES = cfg.room.tables; SEATS = cfg.room.seats; ROOM = cfg.room; CAN_HOST = cfg.canHost;
  $("per").value = String(cfg.groupSize);
  // Only the computer that runs the lab gets the host bar. Anyone else sees the screens and nothing more.
  if (!CAN_HOST) $("host").remove();
  $("qr").src = "qr/match.svg?for=" + encodeURIComponent(cfg.base);
  $("addr").textContent = cfg.address + "/match";
  const v = new URLSearchParams(location.search).get("view");
  if (["join", "help", "groups", "tables"].includes(v)) view = v;
  await load();
  setView(view);
  setInterval(load, 3000);
})();

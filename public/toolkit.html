<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolkit · {{TITLE}}</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="assets/lab.css">
<script src="assets/kinds.js"></script>
<style>
  :root { --disp: "Bricolage Grotesque", Arial, Helvetica, sans-serif; --l0: #006643; --l1: #8C6D00; --l2: #4B57B8; }
  html, body { height: 100%; }
  body { font-size: clamp(11px, min(1.05vw, 1.9vh), 21px); background: #F1F5F2; display: flex; flex-direction: column; overflow: hidden; }
  .top { display: flex; align-items: center; gap: 1em; padding: 0.6em 1.6em; background: var(--green); color: #fff; flex: none; }
  .top h1 { margin: 0; font: 800 1.85em/1 var(--disp); color: #fff; }
  .top .sub { color: #DDE6E1; font-size: 1.05em; }
  .count { margin-left: auto; font-weight: bold; white-space: nowrap; }
  .join { display: flex; align-items: center; gap: 0.6em; background: #fff; color: var(--ink); border-radius: 0.6em; padding: 0.25em 0.7em 0.25em 0.25em; }
  .join img { width: 4.2em; height: 4.2em; display: block; }
  .join span { font-weight: bold; line-height: 1.2; }
  .join b { display: block; color: var(--green); font: 700 1.05em/1.2 var(--disp); word-break: break-all; }
  .start { grid-column: 1 / -1; display: flex; gap: 2.5em; align-items: center; justify-content: center; }
  .start img { width: min(38vh, 28vw); height: auto; background: #fff; border-radius: 1em; border: 0.25em solid var(--gold); }
  .start h2 { font: 800 2.4em/1.1 var(--disp); color: var(--green); margin: 0 0 0.4em; }
  .start p { font-size: 1.4em; margin: 0 0 0.4em; max-width: 22em; }
  .start .addr { font: 700 1.3em/1.2 var(--disp); color: var(--green); word-break: break-all; }
  .blk .x { margin-left: auto; border: 0; background: transparent; color: var(--muted); font: bold 1em var(--f); cursor: pointer; padding: 0 0.3em; }
  .blk .x:hover, .blk .x:focus-visible { color: var(--bad); }
  .count b { font: 800 1.5em/1 var(--disp); color: var(--gold); }
  .lanes { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1em; padding: 0.9em 1.6em 1em; }
  .lane { min-height: 0; display: flex; flex-direction: column; background: #fff; border-radius: 0.9em; overflow: hidden; border-top: 0.45em solid var(--c); }
  .lane > h2 { flex: none; margin: 0; padding: 0.55em 0.8em 0.45em; font: 800 1.45em/1.1 var(--disp); color: var(--c); display: flex; align-items: baseline; gap: 0.5em; }
  .lane > h2 span { margin-left: auto; font: 700 0.62em/1 var(--f); color: var(--muted); white-space: nowrap; }
  .lane .body { flex: 1; min-height: 0; overflow: auto; padding: 0 0.8em 0.8em; }
  .blk { margin: 0 0 0.75em; break-inside: avoid; }
  .body.two { columns: 2; column-gap: 1em; }
  .body.two .pt { font-size: 1em; }
  .blk .an { font-size: 0.8em; font-weight: bold; color: var(--muted); margin: 0 0 0.15em; display: flex; align-items: center; gap: 0.35em; }
  .blk .an i { width: 0.7em; height: 0.7em; border-radius: 50%; background: var(--k); flex: none; }
  .blk .pt { font: 700 1.15em/1.25 var(--disp); color: var(--ink); padding: 0.18em 0 0.18em 0.6em; border-left: 0.25em solid var(--c); margin: 0.12em 0; }
  .note { font: 700 1.3em/1.3 var(--disp); color: var(--green); margin: 1em 1.6em; }
  .pop .pt { animation: pop 0.45s cubic-bezier(.3,1.5,.5,1); }
  @keyframes pop { from { opacity: 0; transform: translateX(-0.6em); } }
  @media (prefers-reduced-motion: reduce) { .pop .pt { animation: none; } }
</style>
</head>
<body>
<header class="top">
  <h1>The <span style="color: var(--gold)">toolkit</span></h1>
  <span class="sub">Who does each part of an assignment</span>
  <div class="join" id="join" hidden><img id="qr-small" alt="QR code for the toolkit form"><span>Send your table&#39;s list<b id="addr-small"></b></span></div>
  <div class="count"><b id="n">0</b> assignments</div>
</header>
<main class="lanes" id="main"></main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
let LEVELS = ["Only the student", "Student + AI", "Agentic AI with Supervision"], CFG = null;
const COLORS = ["var(--l0)", "var(--l1)", "var(--l2)"];
let names = {}, last = "", shown = 0;

// Three columns, one for each answer. Each column lists the parts the tables put there, under the
// assignment they belong to, so the room reads the whole toolkit at a glance.
let seenParts = 0;
function render(ideas) {
  const items = ideas.filter((x) => x.assignment && x.elements && x.elements.length);
  items.sort((a, b) => (names[a.kind] || "").localeCompare(names[b.kind] || "") || a.at - b.at);
  $("n").textContent = items.length;
  const total = items.reduce((n, x) => n + x.elements.length, 0);
  const pop = total > seenParts; seenParts = total;
  $("join").hidden = !items.length;
  // Before any table sends a list, the screen shows the QR code large.
  if (!items.length) {
    $("main").innerHTML = '<div class="start"><img src="qr/idea.svg?for=' + encodeURIComponent(CFG.base) + '" alt="QR code for the toolkit form"><div>' +
      "<h2>Build the toolkit</h2><p>One person at each table scans this code and sends the table&#39;s list.</p><p>Each table&#39;s parts show up here when the table sends them.</p>" +
      '<p class="addr">' + esc(CFG.address) + "/idea</p></div></div>";
    return;
  }
  $("main").innerHTML = LEVELS.map((label, lv) => {
    const blocks = items.map((x) => {
      const parts = x.elements.filter((e) => e.level === lv);
      if (!parts.length) return "";
      // On the computer that runs the lab, each list has an x that takes it off the screen.
      const del = CFG.canHost ? '<button type="button" class="x" data-id="' + esc(x.id) + '" title="Take this list off the screen" aria-label="Take ' + esc(x.assignment) + ' off the screen">x</button>' : "";
      return '<div class="blk" style="--k:' + (x.kind ? kindColor(x.kind) : "#006643") + '"><p class="an"><i></i>' + esc(x.assignment) + del + "</p>" +
        parts.map((e) => '<p class="pt">' + esc(e.name) + "</p>").join("") + "</div>";
    }).join("");
    const n = items.reduce((k, x) => k + x.elements.filter((e) => e.level === lv).length, 0);
    // A long column splits in two so every part stays on the screen.
    return '<section class="lane' + (pop ? " pop" : "") + '" style="--c:' + COLORS[lv] + '"><h2>' + label + "<span>" + n + (n === 1 ? " part" : " parts") + '</span></h2><div class="body' + (n > 14 ? " two" : "") + '">' + (blocks || '<p class="an" style="color:var(--muted)">No parts yet.</p>') + "</div></section>";
  }).join("");
}

// once is true for a single refresh after the host takes a list off, so only one poll loop runs.
async function load(once) {
  try {
    const d = await fetch("api/ideas", { cache: "no-store" }).then((r) => r.json());
    const key = JSON.stringify(d.ideas.map((x) => x.id));
    if (key !== last) { last = key; render(d.ideas); }
  } catch (e) {}
  if (once !== true) setTimeout(load, 3000);
}

$("main").addEventListener("click", async (e) => {
  const b = e.target.closest(".x");
  if (!b || !confirm("Take this list off the toolkit screen? You can't undo this.")) return;
  const r = await fetch("api/ideas/hide", { method: "POST", headers: { "content-type": "application/json", "x-lab-host": "1" }, body: JSON.stringify({ id: b.dataset.id }) });
  if (!r.ok) { alert((await r.json().catch(() => ({}))).error || "That did not work. Try again."); return; }
  last = "";
  load(true);
});

fetch("api/config").then((r) => r.json()).then((c) => {
  CFG = c;
  labKinds(c.assign);
  names = Object.fromEntries(c.assign.map((a) => [a.id, a.name]));
  if (Array.isArray(c.levels) && c.levels.length === 3) LEVELS = c.levels;
  $("qr-small").src = "qr/idea.svg?for=" + encodeURIComponent(c.base);
  $("addr-small").textContent = c.address + "/idea";
  load();
});
</script>
</body>
</html>
